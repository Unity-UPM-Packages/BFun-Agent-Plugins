name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Manifests share one set of values
        run: node scripts/sync-manifests.mjs --check
      - name: Skills have valid frontmatter
        run: node scripts/check-skills.mjs
